[package]
name = "sarvam-code"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
pulldown-cmark = "0.13.6"
ratatui = "0.29"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
textwrap = "0.16.4"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "fs", "io-util"] }
toml = "1.2.1"
unicode-width = "0.2.0"

[dev-dependencies]
tempfile = "3.27.0"
